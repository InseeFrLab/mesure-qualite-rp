<figure>
<svg viewBox="0 0 1700 610" role="img" font-family="inherit"
     aria-label="Pipeline en quatre étapes : découpage du bulletin en blocs, envoi des blocs à un modèle choisi parmi quatre candidats comparés par une mesure, application des consignes, constitution du Fiqual.">
  <defs>
    <marker id="pe-fleche" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0f417a"/>
    </marker>
    <marker id="pe-fleche-j" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b87700"/>
    </marker>
  </defs>
  <!-- 1. Découpage -->
  <rect x="20" y="205" width="240" height="190" rx="14" fill="#0f417a"/>
  <text x="140" y="256" font-size="44" font-weight="700" text-anchor="middle" fill="#ffc300">1</text>
  <text x="140" y="298" font-size="28" font-weight="700" text-anchor="middle" fill="#fff">Découpage</text>
  <text x="140" y="332" font-size="28" font-weight="700" text-anchor="middle" fill="#fff">en blocs</text>
  <text x="140" y="368" font-size="22" text-anchor="middle" fill="#c4e1ff">bulletin FL ou BI</text>
  <!-- flèche 1 -> 2 -->
  <line x1="266" y1="300" x2="372" y2="300" stroke="#0f417a" stroke-width="4" marker-end="url(#pe-fleche)"/>
  <text x="319" y="280" font-size="21" font-style="italic" text-anchor="middle" fill="#0c3a5a">blocs</text>
  <!-- 2. Un modèle, quatre candidats -->
  <rect x="380" y="20" width="560" height="466" rx="16" fill="#f2f7fd" stroke="#286ac7" stroke-width="3" stroke-dasharray="10 8"/>
  <text x="660" y="62" font-size="28" font-weight="700" text-anchor="middle" fill="#0f417a"><tspan fill="#d98c07">2</tspan>  Un modèle, 4 candidats</text>
  <text x="660" y="94" font-size="22" text-anchor="middle" fill="#4a5b6d">l'étude retient le meilleur</text>
    <rect x="410" y="116" width="500" height="78" rx="12" fill="#fff" stroke="#286ac7" stroke-width="3"/>
    <text x="660" y="166" font-size="30" font-weight="700" text-anchor="middle" fill="#0c3a5a">OCR</text>
    <rect x="410" y="206" width="500" height="78" rx="12" fill="#fff" stroke="#286ac7" stroke-width="3"/>
    <text x="660" y="240" font-size="28" font-weight="700" text-anchor="middle" fill="#0c3a5a">Détection d'encre</text>
    <text x="660" y="268" font-size="23" text-anchor="middle" fill="#4a5b6d">cases à cocher</text>
    <rect x="410" y="296" width="500" height="78" rx="12" fill="#fff" stroke="#286ac7" stroke-width="3"/>
    <text x="660" y="330" font-size="28" font-weight="700" text-anchor="middle" fill="#0c3a5a">Multimodal</text>
    <text x="660" y="358" font-size="23" text-anchor="middle" fill="#4a5b6d">prompt « valeur »</text>
    <rect x="410" y="386" width="500" height="78" rx="12" fill="#fff" stroke="#286ac7" stroke-width="3"/>
    <text x="660" y="420" font-size="28" font-weight="700" text-anchor="middle" fill="#0c3a5a">Multimodal</text>
    <text x="660" y="448" font-size="23" text-anchor="middle" fill="#4a5b6d">prompt « ce que tu vois »</text>
  <!-- flèche 2 -> 3 -->
  <line x1="946" y1="300" x2="1102" y2="300" stroke="#0f417a" stroke-width="4" marker-end="url(#pe-fleche)"/>
  <text x="1024" y="262" font-size="21" font-style="italic" text-anchor="middle" fill="#0c3a5a">valeur ou</text>
  <text x="1024" y="286" font-size="21" font-style="italic" text-anchor="middle" fill="#0c3a5a">transcription</text>
  <!-- 3. Consignes -->
  <rect x="1110" y="205" width="240" height="190" rx="14" fill="#0f417a"/>
  <text x="1230" y="256" font-size="44" font-weight="700" text-anchor="middle" fill="#ffc300">3</text>
  <text x="1230" y="298" font-size="28" font-weight="700" text-anchor="middle" fill="#fff">Application</text>
  <text x="1230" y="332" font-size="28" font-weight="700" text-anchor="middle" fill="#fff">des consignes</text>
  <text x="1230" y="368" font-size="22" text-anchor="middle" fill="#c4e1ff">déterministes</text>
  <!-- flèche 3 -> 4 -->
  <line x1="1356" y1="300" x2="1462" y2="300" stroke="#0f417a" stroke-width="4" marker-end="url(#pe-fleche)"/>
  <text x="1409" y="262" font-size="21" font-style="italic" text-anchor="middle" fill="#0c3a5a">valeurs</text>
  <text x="1409" y="286" font-size="21" font-style="italic" text-anchor="middle" fill="#0c3a5a">saisies</text>
  <!-- 4. Fiqual -->
  <rect x="1470" y="205" width="210" height="190" rx="14" fill="#0c3a5a"/>
  <text x="1575" y="256" font-size="44" font-weight="700" text-anchor="middle" fill="#ffc300">4</text>
  <text x="1575" y="298" font-size="28" font-weight="700" text-anchor="middle" fill="#fff">Constitution</text>
  <text x="1575" y="332" font-size="28" font-weight="700" text-anchor="middle" fill="#fff">du Fiqual</text>
  <!-- Mesure : comment on choisit -->
  <line x1="660" y1="520" x2="660" y2="492" stroke="#b87700" stroke-width="4" stroke-dasharray="7 6" marker-end="url(#pe-fleche-j)"/>
  <text x="680" y="511" font-size="20" font-style="italic" fill="#7a4d00">compare</text>
  <rect x="380" y="522" width="560" height="84" rx="12" fill="#ffc300" stroke="#d98c07" stroke-width="3"/>
  <text x="660" y="555" font-size="25" font-weight="700" text-anchor="middle" fill="#1b2a3a">Mesure sur les mêmes blocs</text>
  <text x="660" y="587" font-size="21" text-anchor="middle" fill="#1b2a3a">justes · caractères · erreurs non signalées</text>
</svg>
<figcaption>Les quatre modèles de l'étape 2 sont des alternatives en cours de test. </figcaption>
</figure>
